{% extends 'base.html' %}{% block content %}<div class="page-header"><h1>{{ title }}</h1><a class="btn" href="{% url 'organization_directory_create' kind %}">추가</a></div><nav class="content-menu-tabs"><a href="{% url 'organization_members' %}">구성원</a><a href="{% url 'organization_directory' 'departments' %}"{% if kind == 'departments' %} class="active"{% endif %}>부서</a><a href="{% url 'organization_directory' 'groups' %}"{% if kind == 'groups' %} class="active"{% endif %}>그룹</a></nav><section class="card"><div class="table-wrap"><table><thead><tr><th>이름</th><th>관리</th></tr></thead><tbody>{% for item in items %}<tr><td>{{ item.name }}</td><td><a href="{% url 'organization_directory_edit' kind item.pk %}">수정</a> <form method="post" action="{% url 'organization_directory_delete' kind item.pk %}" style="display:inline">{% csrf_token %}<button type="submit" class="btn btn-danger btn-sm">삭제</button></form></td></tr>{% empty %}<tr><td colspan="2">등록된 항목이 없습니다.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
