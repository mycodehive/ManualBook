{% if content_menu_tabs %}
<nav class="content-menu-tabs" aria-label="업무 탭">
{% for item in content_menu_tabs %}<a href="{% if item.navigation_url == '#' %}#{% else %}{{ item.tab_url }}{% if cycle and not item.is_external %}?cycle={{ cycle.pk }}{% endif %}{% endif %}"{% if item.is_external %} target="_blank" rel="noopener noreferrer"{% endif %}{% if item.tab_current %} class="active" aria-current="page"{% endif %}>{{ item.name }}</a>{% endfor %}
</nav>
{% endif %}
