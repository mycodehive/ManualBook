{% extends 'base.html' %}
{% block title %}내 프로필 · ManualBook{% endblock %}
{% block content %}
<div class="page-header"><div><h1>내 프로필</h1><p>내 계정의 기본 정보를 관리합니다.</p></div></div>
{% include 'partials/account_tabs.html' with account_section='profile' %}
<section class="card">
    <form method="post" class="platform-form">
        {% csrf_token %}
        {% include 'partials/form_fields.html' with form=form %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="form-actions"><button class="btn btn-primary" type="submit">저장</button><a class="btn btn-secondary" href="{% url 'home' %}">취소</a></div>
    </form>
</section>
{% endblock %}
