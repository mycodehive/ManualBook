# TEMPLATE: replace manualbook.example.com and TLS certificate paths.
# Enable only after certificate issuance; this does not obtain certificates.
server {
    listen 80;
    server_name manualbook.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name manualbook.example.com;
    ssl_certificate /etc/letsencrypt/live/manualbook.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manualbook.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location /static/ {
        alias /var/lib/manualbook/static/;
        access_log off;
    }
    # No public media alias. Downloads go through authorized Django endpoints.
    location /media/ { return 404; }
    location /private-media/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        # Preserve the original authority, including an external nonstandard port.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
