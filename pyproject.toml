[project]
name = "manualbook"
version = "0.1.0"
description = "Independent enterprise manual platform"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<5.3",
  "python-dotenv>=1.2,<2",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "cryptography>=44",
  "bleach>=6.2,<7",
  "Markdown>=3.7,<4",
  "gunicorn>=23; sys_platform != 'win32'",
  "python-docx>=1.2,<2",
  "markdownify>=1.1,<2",
  "weasyprint>=70,<71",
]
[dependency-groups]
dev = ["ruff>=0.11", "pytest>=8", "pytest-django>=4.9"]
[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
